# Local Telegram Bot API Server
# This enables file uploads up to 2GB (default Telegram Bot API limit is 20MB)
#
# Setup:
# 1. Get API credentials from https://my.telegram.org/auth
# 2. Set TELEGRAM_API_ID and TELEGRAM_API_HASH in your .env file
# 3. Run: docker compose up -d
# 4. Set TELEGRAM_API_SERVER=http://localhost:8081 in your .env file

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"  # Enable local mode for large file support
      UMASK: "0000"  # Allow all users to read downloaded files
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped
